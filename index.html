<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カードゲームエリア</title>
  <style>
    /* 共通スタイル */
    box-sizing { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 10px; background: #f0f0f0; }

    /* モーダル表示用スタイル */
    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #modal-card {
      width: 250px;
      height: 350px; /* 縦横比 7:5 */
      background-size: cover;
      background-position: center;
      border: 3px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }
    #modal-text {
      color: #fff;
      margin-top: 10px;
      font-size: 14px;
    }

    /* 共有エリア・カードサイズ（例: 140px × 100px = 比率7:5） */
    .shared-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    /* カード固定枠：共有エリアのカードサイズに合わせて横幅・縦幅を追従 */
    .card-slot {
      width: 100px;  /* 横幅 */
      height: 140px; /* 縦幅 (7:5) */
      border: 2px dashed #888;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 手札エリアの設定 */
    .hand-area {
      height: 140px; /* 手札エリアの高さ */
      display: flex;
      gap: 10px;
      background: #e0e0e0;
      padding: 5px;
      align-items: center;
    }

    /* 手札カード：画像全体表示 (contain) & 手札エリアの高さに合わせた縦横比7:5 */
    .hand-card {
      height: 100%;                  /* エリアの縦幅いっぱいに拡大 */
      width: calc(100px * (5 / 7));  /* 縦横比7:5を維持 (約100px) */
      background-size: contain;      /* 画像全体を表示 */
      background-position: center;
      background-repeat: no-repeat;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #fff;
    }

    /* プレイヤー枠コントロール */
    .player-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- 手前側プレイヤーコントロール -->
  <div class="player-controls">
    <!-- 左ライフマスと右側に配置しためくるボタン -->
    <div id="left-life-slot" class="card-slot"></div>
    <button onclick="flipLifeCard('left')">めくる</button>

    <!-- 検索ボタン (下部にあったライフめくりボタンは削除済み) -->
    <button id="search-btn">検索</button>

    <!-- 右ライフマスと左側に配置しためくるボタン -->
    <button onclick="flipLifeCard('right')">めくる</button>
    <div id="right-life-slot" class="card-slot"></div>

    <!-- リフレッシュボタン -->
    <button id="refresh-btn" onclick="handleRefresh()">リフレッシュ</button>
  </div>

  <!-- 手札エリア -->
  <div class="hand-area" id="hand">
    <div class="hand-card" style="background-image: url('https://via.placeholder.com/100x140');"></div>
  </div>

  <!-- 中央拡大モーダル -->
  <div id="modal-overlay">
    <div id="modal-card" onclick="confirmLifeSelection()"></div>
    <div id="modal-text">カードをクリックして選択を確定</div>
  </div>

  <script>
    // デッキとライフの状態定義（サンプルデータ）
    let mainDeck = ['card1', 'card2']; // 空のときのみリフレッシュ可能
    let cemetery = ['dead1', 'dead2', 'dead3', 'dead4'];
    let leftLifeDeck = ['https://via.placeholder.com/100x140/ff0000/ffffff?text=LeftLife'];
    let rightLifeDeck = ['https://via.placeholder.com/100x140/0000ff/ffffff?text=RightLife'];

    let currentSelectingSide = null;
    let currentSelectedCardUrl = '';

    // ライフカードをめくって画面中央に表示
    function flipLifeCard(side) {
      const deck = side === 'left' ? leftLifeDeck : rightLifeDeck;
      if (deck.length === 0) {
        alert('対象のライフデッキにカードがありません。');
        return;
      }
      
      currentSelectingSide = side;
      // 1枚選出（ポップアップ表示用に取得）
      currentSelectedCardUrl = deck[0]; 

      const modal = document.getElementById('modal-overlay');
      const modalCard = document.getElementById('modal-card');
      modalCard.style.backgroundImage = `url('${currentSelectedCardUrl}')`;
      modal.style.display = 'flex';
    }

    // モーダル上のカードをクリックして該当マスに固定
    function confirmLifeSelection() {
      if (!currentSelectingSide) return;

      const slotId = currentSelectingSide === 'left' ? 'left-life-slot' : 'right-life-slot';
      const deck = currentSelectingSide === 'left' ? leftLifeDeck : rightLifeDeck;

      // 枠にカード画像を固定設定
      document.getElementById(slotId).style.backgroundImage = `url('${currentSelectedCardUrl}')`;
      
      // デッキから抽出したカードを取り除く
      deck.shift();

      // モーダルを閉じる
      document.getElementById('modal-overlay').style.display = 'none';
      currentSelectingSide = null;
    }

    // リフレッシュボタン処理（メインデッキが空の時のみ実行）
    function handleRefresh() {
      if (mainDeck.length > 0) {
        alert('メインデッキにまだカードが残っているため、リフレッシュできません。');
        return;
      }

      if (cemetery.length === 0) {
        alert('墓地にカードがありません。');
        return;
      }

      // 墓地をデッキに戻してシャッフル
      mainDeck = [...cemetery];
      cemetery = [];
      
      // デッキから3枚引く処理
      const drawnCards = mainDeck.splice(0, 3);
      alert(`リフレッシュ完了: 墓地をデッキに戻し、${drawnCards.length}枚引きました。`);
    }
  </script>
</body>
</html>
